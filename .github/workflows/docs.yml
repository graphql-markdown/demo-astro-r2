name: Publish documentation

run-name: "Regenerate documentation by @${{ github.actor }}"

# Regenerates the documentation in R2 and then redeploys, because the content
# loader reads the bucket at build time: the pages are baked into the Worker's
# output, so a regeneration only reaches the site through a deploy.
#
# CLOUDFLARE_R2_API_TOKEN needs Workers R2 Storage: Edit *and* Workers Scripts:
# Edit. Generation writes through a `remote: true` binding, which does not reach
# R2 directly: getPlatformProxy() proxies it through a Workers edge-preview
# session, so an R2-only token fails against
# /accounts/<id>/workers/subdomain/edge-preview before touching the bucket.
#
# Its R2 scope can still be limited to this one bucket, but Workers Scripts:
# Edit means it is not a lower-privilege token than the deploy one. See the
# token table in the README.
on:
  workflow_dispatch:

# Shared with deploy.yml, so a push to `main` cannot build and deploy from the
# bucket while `--force` has it half-written. See that workflow.
concurrency:
  group: r2-bucket
  cancel-in-progress: false

jobs:
  publish:
    name: Generate into R2 and redeploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the wrangler.jsonc environment whose DOCS binding is remote,
      # so generation writes to the real bucket rather than local state.
      WRANGLER_ENV: remote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--force` clears the prefix before writing, so a run that dies halfway
      # leaves the bucket partial. The verification step below is what turns
      # that into a failed run rather than a quietly broken site; if you cannot
      # tolerate the window at all, generate into a versioned prefix and swap.
      - name: Generate documentation
        run: npm run doc:force

      # `gqlmd` exits 0 even when a formatter hook failed, so check what
      # actually landed in the bucket rather than trusting the exit status.
      - name: Verify the generated documentation
        run: npm run doc:verify

      # Reads the bucket through the content loader in src/content.config.ts.
      - name: Build
        run: npm run build
        env:
          WRANGLER_ENV: remote

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
