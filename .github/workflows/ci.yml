name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # TEMPORARY: `outputAdapter` has not been released to npm yet, so the
      # generator is built from graphql-markdown's main branch. Drop this
      # checkout, the bun setup and the `link:local` step once it ships.
      - name: Checkout graphql-markdown
        uses: actions/checkout@v7
        with:
          repository: graphql-markdown/graphql-markdown
          path: .graphql-markdown

      - uses: oven-sh/setup-bun@v2

      - name: Build graphql-markdown
        run: bun install --frozen-lockfile && bun run build
        working-directory: .graphql-markdown

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the local graphql-markdown build
        run: npm run link:local
        env:
          GRAPHQL_MARKDOWN_REPO: .graphql-markdown

      # The output adapter makes this cheap: generation runs against Wrangler's
      # local R2 emulation in .wrangler/state, so it needs no bucket, no
      # account and no secrets. It has to come before the build, which reads
      # the same bucket through the content loader.
      - name: Generate documentation into the local R2 emulation
        run: npm run doc:force

      - name: Verify the generated documentation
        run: npm run doc:verify

      - name: Check types
        run: npm run check

      - name: Build
        run: npm run build
