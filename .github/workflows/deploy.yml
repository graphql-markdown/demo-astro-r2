name: Deploy

run-name: "Deploy to Cloudflare Workers by @${{ github.actor }}"

# Publishes the Worker from whatever is currently in the bucket. The build
# reads R2 through the content loader, so this needs read access to it.
# To regenerate the documentation first, use docs.yml instead.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Shared with docs.yml: that workflow empties the bucket before rewriting it,
# and this one builds from whatever the bucket holds, so the two must not
# overlap. Nothing is cancelled — a cancelled docs run leaves the bucket
# half-written, so runs queue instead.
concurrency:
  group: r2-bucket
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: remote

      - name: Deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
