name: Deploy

run-name: "Deploy to Cloudflare Workers by @${{ github.actor }}"

# Publishes the Worker from whatever is currently in the bucket. The build
# reads R2 through the content loader, so this needs read access to it.
# To regenerate the documentation first, use docs.yml instead.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Shared with docs.yml: that workflow empties the bucket before rewriting it,
# and this one builds from whatever the bucket holds, so the two must not
# overlap. Nothing is cancelled — a cancelled docs run leaves the bucket
# half-written, so runs queue instead.
concurrency:
  group: r2-bucket
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
