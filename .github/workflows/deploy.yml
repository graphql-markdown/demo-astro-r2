name: Deploy

run-name: "Regenerate the documentation and deploy by @${{ github.actor }}"

# Regenerates the documentation into R2, then builds and deploys the Worker.
# The content loader reads the bucket at build time, so the pages are baked
# into the Worker's output: a regeneration only reaches the site through a
# build and deploy, which is why both happen in this one job.
#
# Runs on every merge to `main`, and manually to pick up a change to the shared
# demo schema (served from the graphql-markdown repository) without a commit.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  # The same checks pull requests run. A push to `main` used to start them and
  # this deploy in parallel, so nothing stopped a commit that failed them from
  # shipping: the deploy's own `npm run build` catches a broken build, but
  # `astro build` only strips types, so type errors reached production while CI
  # went red beside it. Gating on the job fixes the ordering.
  check:
    name: Check
    uses: $/.github/workflows/ci.yml
    # Caps the token the called workflow can ask for; its own job declares the
    # same read-only scope.
    permissions:
      contents: read

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Generation empties the bucket before rewriting it, and the build reads
    # whatever the bucket holds, so two runs must not overlap. Nothing is
    # cancelled: a cancelled run leaves the bucket half-written, so runs queue
    # instead.
    #
    # Held by this job rather than the whole workflow, so the `check` job above
    # does not hold the group: it runs entirely against local emulation and
    # never reads this bucket.
    concurrency:
      group: r2-bucket
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `--force` clears the prefix before writing, so a run that dies halfway
      # leaves the bucket partial. The verification step below is what turns
      # that into a failed run rather than a quietly broken site; if you cannot
      # tolerate the window at all, generate into a versioned prefix and swap.
      #
      # CLOUDFLARE_R2_API_TOKEN needs Workers R2 Storage: Edit *and* Workers
      # Scripts: Edit: generation writes through a `remote: true` binding, which
      # getPlatformProxy() proxies through a Workers edge-preview session, so an
      # R2-only token fails before touching the bucket. See the README.
      - name: Generate the documentation into the bucket
        run: npm run doc:force
        # Credentials sit on the steps that use the bucket rather than on the
        # job, so they stay out of the environment of `npm ci`, which runs the
        # lifecycle scripts of every dependency.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Selects the wrangler.jsonc environment whose DOCS binding is
          # remote, so generation writes to the real bucket rather than local
          # state.
          WRANGLER_ENV: remote
          # Prints the telemetry payload instead of sending it.
          GRAPHQL_MARKDOWN_TELEMETRY_DEBUG: "1"

      # `gqlmd` exits 0 even when a formatter hook failed, so check what
      # actually landed in the bucket rather than trusting the exit status.
      - name: Verify the documentation in the bucket
        run: npm run doc:verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: remote

      # Reads the bucket through the content loader in src/content.config.ts.
      - name: Build
        run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_ENV: remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
