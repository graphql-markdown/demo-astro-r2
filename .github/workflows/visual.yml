name: Visual tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Argos authenticates through GitHub Actions OIDC, per repository.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  argos:
    name: Argos screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Generation and the build both run against Wrangler's local R2
      # emulation (no WRANGLER_ENV), so no Cloudflare credentials are needed.
      - name: Generate the documentation
        run: npm run doc:force

      - name: Build site
        run: npm run build

      - name: Screenshot and upload to Argos
        run: npm run test:visual
